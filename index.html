<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1728">
    <meta
      name="description"
      content="MiFiL — a home for little worlds, games and apps."
    >
    <title>MiFiL — A home for little worlds</title>

    <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="assets/watercolor-home.css?v=14">

    <script defer src="texts.js"></script>
    <script defer src="assets/project-teasers.js?v=9"></script>
    <script defer src="assets/project-status.js?v=12"></script>
    <script defer src="js/house.js?v=14"></script>
    <script defer src="script.js?v=14"></script>
  </head>
  <body class="home-body">
    <a class="skip" href="#worlds" data-i="skip">Skip to projects</a>

    <div class="site-shell">
      <header class="site-header">
        <a class="brand" href="index.html" aria-label="MiFiL — Home">
          <img src="assets/logo-stacked.svg" alt="MiFiL" width="140" height="88">
        </a>

        <a class="header-link" href="page.html?view=about" data-i="about">
          About MiFiL
        </a>
      </header>

      <main id="main" class="home">
        <section class="worlds" id="worlds" aria-labelledby="worlds-title">
          <div class="worlds-inner">
            <h1 id="worlds-title" data-i="worlds">Worlds</h1>

            <nav class="project-list" aria-label="Projects" data-label="worlds">
              <a data-project="playable-letter" class="project-entry" href="playable-letter/">
                <span class="project-icon"><img src="assets/icon-playable-letter.png?v=13" alt="" width="44" height="44"></span>
                <span class="project-copy"><span class="project-name">Playable Letter</span><span class="project-description" data-teaser="playable-letter"></span></span>
                <span class="arrow" aria-hidden="true">↗</span>
              </a>
              <button type="button" data-project="livemo" class="project-entry is-unreleased" aria-disabled="true">
                <span class="project-icon"><img src="assets/icon-livemo.png?v=13" alt="" width="44" height="44"></span>
                <span class="project-copy"><span class="project-name">livEmo</span><span class="project-description" data-teaser="livemo"></span></span>
                <span class="status-soon" data-coming-soon></span>
              </button>
              <button type="button" data-project="our-quest" class="project-entry is-unreleased" aria-disabled="true">
                <span class="project-icon"><img src="assets/icon-our-quest.png?v=13" alt="" width="44" height="44"></span>
                <span class="project-copy"><span class="project-name">Our Quest</span><span class="project-description" data-teaser="our-quest"></span></span>
                <span class="status-soon" data-coming-soon></span>
              </button>
              <button type="button" data-project="feel" class="project-entry is-unreleased" aria-disabled="true">
                <span class="project-icon"><img src="assets/icon-feel.png?v=13" alt="" width="44" height="44"></span>
                <span class="project-copy"><span class="project-name">FEEL</span><span class="project-description" data-teaser="feel"></span></span>
                <span class="status-soon" data-coming-soon></span>
              </button>
            </nav>
          </div>
        </section>

        <section class="scene" aria-label="Interactive house" data-label="house">
          <div class="scene-stage" id="stage">
            <div class="scene-night" aria-hidden="true"></div>
            <div class="scene-halo"></div>

            <div class="scene-fallback" id="fallback">
              <img src="assets/house-fallback.webp" alt="" width="600" height="500">
            </div>

            <canvas id="house-canvas" aria-hidden="true"></canvas>
            <div class="window-label" id="window-label" hidden></div>

            <!-- Mobile: labels follow the actual visible 3D windows. -->
            <div class="window-names" id="window-names" hidden>
              <span class="window-name is-unreleased" data-window-project="livemo" hidden>livEmo</span>
              <span class="window-name is-unreleased" data-window-project="our-quest" hidden>Our Quest</span>
              <span class="window-name is-unreleased" data-window-project="feel" hidden>FEEL</span>
              <a class="window-name" data-window-project="playable-letter" href="playable-letter/" hidden>Playable Letter</a>
            </div>
          </div>

          <div class="scene-controls" id="scene-controls" hidden>
            <button class="rotate" type="button" id="rotate-left" data-label="left" aria-label="Rotate left">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 6-6 6 6 6M6 12h12"></path></svg>
            </button>
            <div class="scene-pager">
              <div class="scene-progress" role="group" aria-label="Project windows">
                <button class="scene-dot" data-face="livemo" aria-label="livEmo" title="livEmo"></button>
                <button class="scene-dot" data-face="our-quest" aria-label="Our Quest" title="Our Quest"></button>
                <button class="scene-dot" data-face="feel" aria-label="FEEL" title="FEEL"></button>
                <button class="scene-dot" data-face="playable-letter" aria-label="Playable Letter" title="Playable Letter"></button>
              </div>
            </div>
            <button class="rotate" type="button" id="rotate-right" data-label="right" aria-label="Rotate right">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 6 6 6-6 6m6-6H6"></path></svg>
            </button>
          </div>

          <p class="fallback-hint" id="fallback-hint" data-i="fallback" hidden>
            Choose a world from the list.
          </p>

          <span class="sr-only" id="scene-status" aria-live="polite"></span>
        </section>
      </main>

      <footer class="site-footer">
        <span class="copyright">© <span id="year">2026</span> MiFiL</span>

        <nav class="footer-links" aria-label="Site information">
          <a href="page.html?view=about" data-i="about">About MiFiL</a>
          <a href="page.html?view=creator" data-i="creator">From the creator</a>
          <a href="page.html?view=privacy" data-i="privacy">Privacy</a>
        </nav>

        <div class="language">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9"></circle>
            <ellipse cx="12" cy="12" rx="4" ry="9"></ellipse>
            <path d="M3 12h18"></path>
          </svg>

          <label class="sr-only" for="language" data-i="language">Language</label>
          <select id="language" aria-label="Language">
            <option value="en">English</option>
          </select>
          <span aria-hidden="true" class="select-chevron">⌄</span>
        </div>
      </footer>
    </div>

    <div class="transition" id="transition" aria-hidden="true"></div>
  </body>
</html>
