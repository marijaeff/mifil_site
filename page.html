<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1728">
    <title>MiFiL</title>

    <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="assets/project-pages.css">

    <!-- Keep older links to Playable Letter working. -->
    <script>
      if (new URLSearchParams(location.search).get('view') === 'playable-letter') {
        location.replace(new URL('playable-letter/', document.baseURI).href);
      }
    </script>
    <script defer src="texts.js"></script>
    <script type="module" src="firebase/site-content.js"></script>
    <script defer src="script.js"></script>
  </head>
  <body class="detail-body">
    <div class="site-shell">
      <header class="site-header">
        <a class="brand" href="index.html" aria-label="MiFiL — Home">
          <img src="assets/mifil-logo-header-transparent.png?v=15" alt="MiFiL" width="140" height="104">
        </a>

        <a class="header-link" href="index.html" data-i="home">Home</a>
      </header>

      <main class="detail" id="main">
        <a class="back" href="index.html">
          <span aria-hidden="true">←</span>
          <span data-i="back">Back to the house</span>
        </a>

        <article class="detail-content" id="detail-content">
          <p class="detail-kicker" id="detail-kicker">MiFiL</p>
          <h1 id="detail-title">MiFiL</h1>
          <p class="detail-description" id="detail-description"></p>
          <div class="detail-actions" id="detail-actions"></div>
          <noscript><p>Enable JavaScript to view project information.</p></noscript>
        </article>

        <div class="detail-art" aria-hidden="true">
          <img class="detail-illustration" src="assets/project-window.svg" alt="">
        </div>
        <nav class="detail-worlds" aria-label="Worlds" data-label="worlds">
          <span class="detail-worlds-label" data-i="worlds">Worlds</span>
          <div class="detail-worlds-links">
            <a data-world="livemo" href="page.html?view=livemo">livEmo</a>
            <a data-world="our-quest" href="page.html?view=our-quest">Our Quest</a>
            <a data-world="feel" href="page.html?view=feel">FEEL</a>
            <a data-world="playable-letter" href="playable-letter/">Playable Letter</a>
          </div>
        </nav>
      </main>

      <footer class="site-footer">
        <span>© <span id="year">2026</span> MiFiL</span>

        <nav class="footer-links">
          <a href="page.html?view=about" data-i="about">About MiFiL</a>
          <a href="page.html?view=creator" data-i="creator">From the creator</a>
          <a href="page.html?view=privacy" data-i="privacy">Privacy</a>
        </nav>

        <div class="language">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9"></circle>
            <ellipse cx="12" cy="12" rx="4" ry="9"></ellipse>
            <path d="M3 12h18"></path>
          </svg>

          <label class="sr-only" for="language" data-i="language">Language</label>
          <select id="language" aria-label="Language">
            <option value="en">English</option>
          </select>
          <span class="select-chevron" aria-hidden="true">⌄</span>
        </div>
      </footer>
    </div>
  </body>
</html>
